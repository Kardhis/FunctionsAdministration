spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jackson:
    time-zone: Europe/Madrid
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}
  password-reset:
    token-validity-seconds: ${APP_PASSWORD_RESET_TTL_SECONDS:3600}
    mail-from: ${APP_PASSWORD_RESET_MAIL_FROM:}
    mail-subject: ${APP_PASSWORD_RESET_MAIL_SUBJECT:Recuperación de contraseña}
  demo:
    seed-user: false
  auth:
    cookie-secure: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://168.231.84.188,https://168.231.84.188}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    dateformat: dd-MM-yyyy HH:mm:ss
