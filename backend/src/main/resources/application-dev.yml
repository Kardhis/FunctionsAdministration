# Desarrollo local: define DB_URL, DB_USER, DB_PASSWORD y APP_JWT_SECRET (p. ej. variables de entorno o .env del IDE).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  flyway:
    enabled: true
  jackson:
    time-zone: Europe/Madrid

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-change-in-production-min-32-chars}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  # APP_DEMO_SEED_USER=true crea adminuser@mail.com / password al arrancar (ver README).
  demo:
    seed-user: ${APP_DEMO_SEED_USER:false}

logging:
  pattern:
    dateformat: dd-MM-yyyy HH:mm:ss

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

