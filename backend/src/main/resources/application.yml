spring:
  application:
    name: backend
  # Belt-and-suspenders: also set via @SpringBootApplication(exclude=...). Ensures this runs even if
  # an older fat JAR or layered image missed the annotation metadata refresh.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    time-zone: Europe/Madrid

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
  pattern:
    dateformat: dd-MM-yyyy HH:mm:ss

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    cookie-name: access_token
    cookie-same-site: Lax
    cookie-secure: false
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-change-in-production-min-32-chars}
    expires-seconds: 3600
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  password-reset:
    token-validity-seconds: ${APP_PASSWORD_RESET_TTL_SECONDS:3600}
    mail-from: ${APP_PASSWORD_RESET_MAIL_FROM:dcastel.work@gmail.com}
    mail-subject: ${APP_PASSWORD_RESET_MAIL_SUBJECT:Recuperación de contraseña}
  demo:
    seed-user: false
  cors:
    # Default also allows prod host when profile env var is missing.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://168.231.84.188,https://168.231.84.188}
