services:
  mysql:
    image: mysql:8.4
    container_name: functions-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - functions_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: functions-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_FRONTEND_BASE_URL: http://168.231.84.188
      APP_CORS_ALLOWED_ORIGINS: http://168.231.84.188
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: functions-frontend
    depends_on:
      - backend

    # Si el navegador usa solo el puerto 80 (SPA + proxy), no hace falta exponer 8080 al exterior;
    # nginx en el host puede proxy_pass a 127.0.0.1:8080. Si no hay proxy, abre el firewall para 8080.
    ports:
      - "80:80"

volumes:
  functions_mysql_data: